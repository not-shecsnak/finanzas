name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Corre los tests y falla si la cobertura baja del umbral de vitest.config.ts.
      - name: Tests con cobertura
        run: npm run test:coverage

      - name: Subir cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      # Solo dependencias de runtime. `braces` (GHSA-vfj7-8cjw-p6xm, DoS) llega solo por
      # eslint-config-next (herramienta de lint) y npm no ofrece version parcheada; revisar
      # al actualizar eslint-config-next y volver a auditar todo (quitar --omit=dev).
      - name: Auditoria de dependencias (runtime)
        run: npm audit --omit=dev --audit-level=high

      # Variables ficticias: solo para que compile; no son credenciales reales.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

